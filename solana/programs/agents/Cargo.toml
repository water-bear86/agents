[package]
name = "agents"
version = "0.1.0"
description = "Agent registry and non-custodial agent vaults: owners fund and withdraw, a session key trades through Jupiter within caps"
edition = "2021"
rust-version = "1.79"

[lib]
crate-type = ["cdylib", "lib"]
name = "agents"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token", "token_2022", "associated_token"] }
pyth-solana-receiver-sdk = "=1.2.0"
